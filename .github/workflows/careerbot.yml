name: Career Newsroom V2 Company Identity

on:
  schedule:
    - cron: "0 7-23 * * *"
      timezone: "Asia/Dhaka"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: career-newsroom-v2-2
  cancel-in-progress: false

jobs:
  run-career-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: "@CareerNewsroom"
      CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ben

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python source
        run: python -m py_compile main.py

      - name: Run self-test
        run: python main.py --self-test

      - name: Run Career Newsroom
        run: python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name "CareerNewsroom Bot"
          git config user.email "actions@github.com"
          git add job_state.json posted_urls.txt source_registry.json company_logo_cache.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update CareerNewsroom state"
            git push
          fi
