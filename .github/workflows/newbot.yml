name: Career News V1

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: career-news-v1
  cancel-in-progress: false

jobs:
  run-career-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL || 'gpt-oss-120b' }}
      TELEGRAM_CHANNEL: "@CareerNewsroom"
      PYTHONUNBUFFERED: "1"
      MAX_POST_AGE_DAYS: "5"
      PRIVATE_DISCOVERY_TARGET: "120"
      PRIVATE_DISCOVERY_MAX: "200"
      PRIVATE_FAST_RANK_TARGET: "40"
      PRIVATE_DETAIL_TARGET: "40"
      AI_REVIEW_TARGET: "35"
      DETAIL_WORKERS: "8"
      POST_DELAY_SECONDS: "1.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile main.py

      - name: Run V1 self-test
        run: python main.py --self-test

      - name: Run live source diagnostics (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: python main.py --source-test

      - name: Run Career News V1
        run: python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name "Career News Bot"
          git config user.email "actions@github.com"
          git add news_state.json posted_urls.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Career News V1 state"
            git push
          fi
