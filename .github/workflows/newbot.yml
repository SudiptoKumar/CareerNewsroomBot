name: Career News Bot

on:
  schedule:
    - cron: "0 */3 * * *"
      timezone: "Asia/Dhaka"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: career-news-bot
  cancel-in-progress: false

jobs:
  run-career-bot:
    # Pin the currently stable runner image; avoid the announced ubuntu-latest migration during this bot's production lifecycle.
    runs-on: ubuntu-24.04
    timeout-minutes: 6

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL || 'gpt-oss-120b' }}
      TELEGRAM_CHANNEL: "@CareerNewsroom"
      SCRAPLING_ENABLED: "1"
      PYTHONUNBUFFERED: "1"
      FAST_PRIVATE_CANDIDATE_TARGET: "160"
      FAST_GOVERNMENT_CANDIDATE_TARGET: "10"
      FAST_DETAIL_WORKERS: "10"
      FAST_AI_CANDIDATE_LIMIT: "32"
      FAST_DISCOVERY_TIMEOUT: "15"
      FAST_DETAIL_TIMEOUT: "18"
      POST_DELAY_SECONDS: "1.0"
      PRIVATE_RESEARCH_TARGET: "40"
      PRIVATE_QUALITY_FLOOR: "64"
      BDJOBS_CATEGORY_CANDIDATES_PER_CATEGORY: "10"
      BDJOBS_CATEGORY_WORKERS: "1"
      MAX_PRIVATE_POST_AGE_DAYS: "5"
      SCRAPLING_DYNAMIC_ENABLED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python and Scrapling runtime
        run: |
          python -m py_compile main.py
          python -c "import scrapling; from scrapling.fetchers import Fetcher, DynamicFetcher; print('Scrapling OK:', getattr(scrapling, '__version__', 'installed'))"
          echo "Browser executable: $(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"

      - name: Run self-test
        run: python main.py --self-test

      - name: Run live source diagnostics (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: python main.py --source-test

      - name: Run Career News Bot
        run: python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name "Career News Bot"
          git config user.email "actions@github.com"
          git add news_state.json posted_urls.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Career News Bot state"
            git push
          fi
