name: CareerNewsroom V2

on:
  schedule:
    - cron: "5 4 * * *"
    - cron: "20 4 * * *"
    - cron: "35 4 * * *"
    - cron: "5 11 * * *"
    - cron: "20 11 * * *"
    - cron: "35 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run pipeline without Telegram publishing"
        required: false
        type: boolean
        default: false
      force_run:
        description: "Bypass scheduler guard"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: career-newsroom-v2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify persistent state files
        shell: bash
        run: |
          set -euo pipefail
          test -f news_state.json || printf '%s\n' '{"format_version":20,"schedule_guard":{},"queue":{},"events":{},"rejections":{},"run_history":[],"last_run":"","pipeline_version":"CareerNewsroom V2"}' > news_state.json
          test -f posted_urls.txt || : > posted_urls.txt

      - name: Run self-test
        run: python main.py --self-test

      - name: Run CareerNewsroom V2
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_PROMO_URL: ${{ secrets.TELEGRAM_PROMO_URL }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              python main.py --manual --dry-run
            elif [ "${{ inputs.force_run }}" = "true" ]; then
              python main.py --manual
            else
              python main.py
            fi
          else
            python main.py
          fi

      - name: Persist state safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CareerNewsroom Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f news_state.json || : > news_state.json
          test -f posted_urls.txt || : > posted_urls.txt
          git add news_state.json posted_urls.txt
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "CareerNewsroom V2 state update [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "State push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Final state push failed."
          exit 1
