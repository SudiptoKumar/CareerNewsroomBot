name: CareerNewsroom V2

on:
  schedule:
    # Asia/Dhaka 10:05 / 10:20 / 10:35
    - cron: "5 4 * * *"
    - cron: "20 4 * * *"
    - cron: "35 4 * * *"
    # Asia/Dhaka 17:05 / 17:20 / 17:35
    - cron: "5 11 * * *"
    - cron: "20 11 * * *"
    - cron: "35 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run pipeline without Telegram publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: career-newsroom-v2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run self-test
        run: python main.py --self-test

      - name: Run CareerNewsroom V2
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_PROMO_URL: ${{ secrets.TELEGRAM_PROMO_URL }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --manual --dry-run
          else
            python main.py
          fi

      - name: Persist state safely
        run: |
          git config user.name "CareerNewsroom Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_state.json posted_urls.txt
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "CareerNewsroom V2 state update [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "State push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Final state push failed."
          exit 1
