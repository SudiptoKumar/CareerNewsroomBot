name: CareerNewsroom

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: career-newsroom
  cancel-in-progress: false

jobs:
  run-career-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL || 'gpt-oss-120b' }}
      TELEGRAM_CHANNEL: "@CareerNewsroom"
      PYTHONUNBUFFERED: "1"
      MAX_POST_AGE_DAYS: "5"
      PRIVATE_DISCOVERY_TARGET: "160"
      PRIVATE_DISCOVERY_MAX: "200"
      PRIVATE_FAST_RANK_TARGET: "60"
      PRIVATE_DETAIL_TARGET: "60"
      INTERNSHIP_DETAIL_TARGET: "10"
      INTERNSHIP_AI_TARGET: "8"
      MIN_INTERNSHIP_POSTS_PER_RUN: "2"
      PRIVATE_SNAPSHOT_MIN_FIELDS: "4"
      GOVERNMENT_SNAPSHOT_MIN_FIELDS: "3"
      AI_REVIEW_TARGET: "24"
      AI_BATCH_SIZE: "12"
      AI_RETRY_COUNT: "1"
      CEREBRAS_TIMEOUT_SECONDS: "35"
      CEREBRAS_REQUEST_RETRIES: "1"
      CEREBRAS_RATE_LIMIT_MAX_WAIT_SECONDS: "4"
      CEREBRAS_REASONING_EFFORT: "low"
      PRIVATE_REQUIRE_EXPERIENCE: "0"
      MIN_PRIVATE_POSTS_PER_RUN: "10"
      MIN_GOVERNMENT_POSTS_PER_RUN: "3"
      PRIVATE_MIN_FILL_SCORE: "58"
      PRIVATE_HARD_FILL_SCORE: "55"
      PRIVATE_MIN_INFORMATION_QUALITY: "3"
      PRIVATE_HARD_MIN_INFORMATION_QUALITY: "3"
      DETAIL_WORKERS: "8"
      DETAIL_TIMEOUT: "14"
      SCRAPLING_BROWSER_ENABLED: "1"
      SCRAPLING_BROWSER_TIMEOUT: "60000"
      SCRAPLING_BROWSER_WAIT_MS: "750"
      SCRAPLING_BROWSER_DETAIL_LIMIT: "60"
      SCRAPLING_BROWSER_WAIT_SELECTOR: "app-summary #allSection"
      SCRAPLING_BROWSER_NETWORK_IDLE: "1"
      DETAIL_MIN_TEXT_CHARS: "180"
      POST_DELAY_SECONDS: "1.0"
      CURL_IMPERSONATES: "safari18_0_ios,safari184_ios,safari260_ios,safari_ios"
      CURL_MAX_FINGERPRINT_ATTEMPTS: "4"
      JINA_ENABLED: "1"
      JINA_TIMEOUT: "12"
      JINA_RPM_LIMIT: "24"
      TELEGRAM_PROMO_URL: "https://t.me/CareerNewsroom"
      DEADLINE_SWEEP_MAX_UPDATES_PER_RUN: "100"
      STATE_PUSH_RETRIES: "4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          scrapling install --force
          patchright install chromium --with-deps

      - name: Compile check
        run: python -m py_compile main.py


      - name: Run V1 self-test
        run: python main.py --self-test

      - name: Run live source diagnostics (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: python main.py --source-test

      - name: Run CareerNewsroom
        run: python main.py

      - name: Save state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Career News Bot"
          git config user.email "actions@github.com"
          git add news_state.json posted_urls.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update CareerNewsroom state"
          branch="${GITHUB_REF_NAME:-main}"
          retries="${STATE_PUSH_RETRIES:-4}"

          for attempt in $(seq 1 "$retries"); do
            echo "State push attempt ${attempt}/${retries}"
            if git push origin "HEAD:${branch}"; then
              echo "State push succeeded."
              exit 0
            fi

            if [ "$attempt" -eq "$retries" ]; then
              echo "State push failed after ${retries} attempts." >&2
              exit 1
            fi

            echo "Push rejected/transiently failed; refreshing origin/${branch} before retry."
            git fetch origin "$branch"
            if ! git rebase "origin/${branch}"; then
              echo "State rebase conflict: remote state changed concurrently. Aborting to avoid overwriting repository state." >&2
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 2))
          done
