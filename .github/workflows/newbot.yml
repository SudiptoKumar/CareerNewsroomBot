name: CareerNewsroom Polish 1.2

on:
  schedule:
    - cron: "0,30 8-23 * * *"
      timezone: "Asia/Dhaka"
    - cron: "0,30 0-2 * * *"
      timezone: "Asia/Dhaka"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: careernewsroom-polish-1-2
  cancel-in-progress: false

jobs:
  run-career-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL || 'gpt-oss-120b' }}
      TELEGRAM_CHANNEL: "@CareerNewsroom"
      PYTHONUNBUFFERED: "1"
      FAST_PRIVATE_CANDIDATE_TARGET: "60"
      FAST_GOVERNMENT_CANDIDATE_TARGET: "10"
      FAST_DETAIL_WORKERS: "8"
      FAST_AI_CANDIDATE_LIMIT: "20"
      FAST_DISCOVERY_TIMEOUT: "15"
      FAST_DETAIL_TIMEOUT: "18"
      POST_DELAY_SECONDS: "1.0"
      MAX_PRIVATE_EXPERIENCE_YEARS: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python source
        run: python -m py_compile main.py

      - name: Run Polish 1.2 self-test
        run: python main.py --self-test

      - name: Run CareerNewsroom Polish 1.2
        run: python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name "Career News Bot"
          git config user.email "actions@github.com"
          git add news_state.json posted_urls.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update CareerNewsroom Polish 1.2 state"
            git push
          fi
