name: Career News Bot 1.5

on:
  schedule:
    - cron: "0,30 8-23 * * *"
      timezone: "Asia/Dhaka"
    - cron: "0,30 0-2 * * *"
      timezone: "Asia/Dhaka"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: career-news-bot-1-5
  cancel-in-progress: false

jobs:
  run-career-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL || 'gpt-oss-120b' }}
      TELEGRAM_CHANNEL: "@CareerNewsroom"
      PYTHONUNBUFFERED: "1"
      FAST_PRIVATE_CANDIDATE_TARGET: "60"
      FAST_GOVERNMENT_CANDIDATE_TARGET: "10"
      FAST_DETAIL_WORKERS: "8"
      FAST_AI_CANDIDATE_LIMIT: "20"
      FAST_DISCOVERY_TIMEOUT: "15"
      FAST_DETAIL_TIMEOUT: "18"
      POST_DELAY_SECONDS: "1.0"
      MAX_PRIVATE_EXPERIENCE_YEARS: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Career News Bot version
        run: |
          grep -q 'PIPELINE_VERSION = "Polish-1.5"' main.py
          grep -q 'name: Career News Bot 1.5' .github/workflows/newbot.yml
          echo "Career News Bot 1.5 source/workflow verified."

      - name: Verify Python source
        run: python -m py_compile main.py

      - name: Run Career News Bot 1.5 self-test
        run: python main.py --self-test

      - name: Run Career News Bot 1.5
        run: python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name "Career News Bot"
          git config user.email "actions@github.com"
          git add news_state.json posted_urls.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update Career News Bot 1.5 state"

          # The bot has already published successfully before this step.
          # Retry state persistence so a transient GitHub commit_refs/remote
          # error does not leave the runner's duplicate-protection state behind.
          for attempt in 1 2 3; do
            echo "State push attempt $attempt/3"
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase failed on attempt $attempt; aborting rebase."
              git rebase --abort || true
            }

            if git push origin HEAD:main; then
              echo "State push succeeded on attempt $attempt."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "ERROR: State push failed after 3 attempts."
          exit 1
