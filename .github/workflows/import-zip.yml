name: Import Project ZIP

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose an operation"
        required: true
        default: "import"
        type: choice
        options:
          - clean
          - import

permissions:
  contents: write

jobs:
  project-manager:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # ==================================================
      # CLEAN
      #
      # Deletes everything except:
      #   1. .github/workflows/
      #   2. ZIP files in repository root
      #
      # ZIP files are NOT extracted or deleted.
      # ==================================================
      - name: Clean repository
        if: ${{ inputs.operation == 'clean' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning repository..."

          # Delete everything at repository root except .git, .github and ZIP files.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -iname "*.zip" \
            -exec rm -rf {} +

          # Keep only .github/workflows inside .github.
          if [ -d ".github" ]; then
            find .github -mindepth 1 -maxdepth 1 \
              ! -name "workflows" \
              -exec rm -rf {} +
          fi

          echo ""
          echo "Cleanup complete."
          echo "Preserved:"
          echo "  .github/workflows/"
          echo "  ZIP files in repository root"

          echo ""
          echo "Remaining files:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      # ==================================================
      # FIND ZIP
      # ==================================================
      - name: Find ZIP
        if: ${{ inputs.operation == 'import' }}
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -print
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found in repository root."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::More than one ZIP file found."
            echo "Please keep only one ZIP before running Import."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP="${ZIPS[0]}"

          echo "Found: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"

      # ==================================================
      # EXTRACT ZIP
      # ==================================================
      - name: Extract ZIP
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/project
          mkdir -p /tmp/project

          unzip -q -o \
            "${{ steps.find_zip.outputs.ZIP }}" \
            -d /tmp/project

          echo "ZIP extracted successfully."

      # ==================================================
      # DETECT PROJECT ROOT
      # ==================================================
      - name: Detect project root
        if: ${{ inputs.operation == 'import' }}
        id: project_root
        shell: bash
        run: |
          set -euo pipefail

          ROOT="/tmp/project"

          # ZIP contains project files directly.
          if [ -f "$ROOT/main.py" ] || \
             [ -f "$ROOT/package.json" ] || \
             [ -f "$ROOT/requirements.txt" ] || \
             [ -d "$ROOT/app" ] || \
             [ -d "$ROOT/src" ] || \
             [ -d "$ROOT/tests" ] || \
             [ -d "$ROOT/.github" ]; then

            echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ZIP contains one top-level project folder.
          mapfile -t DIRS < <(
            find "$ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d
          )

          mapfile -t FILES < <(
            find "$ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type f
          )

          if [ "${#DIRS[@]}" -eq 1 ] && \
             [ "${#FILES[@]}" -eq 0 ]; then

            echo "ROOT=${DIRS[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"
          fi

      # ==================================================
      # IMPORT EVERYTHING
      #
      # .github is NOT excluded.
      # Existing files with the same path are replaced.
      # New files are added.
      # ==================================================
      - name: Import project
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project_root.outputs.ROOT }}"

          rsync -a \
            --exclude=".git/" \
            "$ROOT/" ./

          echo "Project imported successfully."

      # ==================================================
      # DELETE ZIP FILES
      # ==================================================
      - name: Delete ZIP files
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        run: |
          set -euo pipefail

          find . -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -delete

          echo "All ZIP files deleted."

      # ==================================================
      # COMMIT AND PUSH
      # ==================================================
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          if [ "${{ inputs.operation }}" = "clean" ]; then
            MESSAGE="Clean repository"
          else
            MESSAGE="Import project from ZIP"
          fi

          git commit -m "$MESSAGE"
          git push

          echo ""
          echo "========================================"
          echo "SUCCESS"
          echo "Operation: ${{ inputs.operation }}"
          echo "========================================"
