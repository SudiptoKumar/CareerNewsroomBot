name: Import Project ZIP

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose what to do"
        required: true
        default: "import"
        type: choice
        options:
          - import
          - clean

permissions:
  contents: write

concurrency:
  group: repository-import
  cancel-in-progress: false

jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import or clean
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.operation }}" = "clean" ]; then
            find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" ! -iname "*.zip" -exec rm -rf {} +
            find .github/workflows -mindepth 1 -maxdepth 1 ! -name "import-zip.yml" -exec rm -f {} + 2>/dev/null || true
            echo "Repository cleaned."
            exit 0
          fi

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname "*.zip" -print)
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Exactly one ZIP must be present in repository root."
            exit 1
          fi
          ZIP="${ZIPS[0]}"

          while IFS= read -r entry; do
            entry="${entry#./}"
            [[ "$entry" != /* ]] || { echo "::error::Unsafe absolute ZIP path: $entry"; exit 1; }
            [[ "$entry" != ../* && "$entry" != */../* && "$entry" != *"/.." ]] || { echo "::error::Unsafe traversal path: $entry"; exit 1; }
          done < <(unzip -Z1 "$ZIP")

          rm -rf /tmp/project /tmp/state-backup
          mkdir -p /tmp/project /tmp/state-backup
          unzip -q -o "$ZIP" -d /tmp/project

          ROOT=/tmp/project
          if [ ! -f "$ROOT/README.md" ] && [ -d "$ROOT/CareerNewsroom-V2" ]; then
            ROOT="$ROOT/CareerNewsroom-V2"
          else
            mapfile -t DIRS < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type d)
            mapfile -t FILES < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type f)
            if [ ! -f "$ROOT/README.md" ] && [ "${#DIRS[@]}" -eq 1 ] && [ "${#FILES[@]}" -eq 0 ]; then
              ROOT="${DIRS[0]}"
            fi
          fi

          # Preserve live state from the current repository. Empty/new placeholders from the ZIP never overwrite it.
          for f in news_state.json posted_urls.txt; do
            if [ -f "$f" ]; then cp "$f" "/tmp/state-backup/$f"; fi
          done

          mkdir -p /tmp/workflow-backup
          [ -f .github/workflows/import-zip.yml ] && cp .github/workflows/import-zip.yml /tmp/workflow-backup/import-zip.yml || true

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -a "$ROOT"/. ./

          mkdir -p .github/workflows
          if [ -f /tmp/workflow-backup/import-zip.yml ]; then cp /tmp/workflow-backup/import-zip.yml .github/workflows/import-zip.yml; fi

          for f in news_state.json posted_urls.txt; do
            if [ -s "/tmp/state-backup/$f" ]; then cp "/tmp/state-backup/$f" "$f"; fi
          done

          rm -f -- *.zip
          echo "Import completed with persistent state preserved."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes."
            exit 0
          fi
          git commit -m "Import CareerNewsroom V2 project"
          git push origin HEAD:${GITHUB_REF_NAME}
